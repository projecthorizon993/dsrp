name: Release
run-name: Release ${{ github.ref_name }}

# Tag-driven: the tag is the version. Push vX.Y.Z and this builds that tag and publishes a GitHub
# Release. There is deliberately no semantic-release step here - upstream computed a version from
# commits and created the tag itself, which meant the tag and the commit it described could disagree.
# Making the tag the single source of truth removes that class of mistake, and `prepare` fails the
# release if the tag and the manifests ever do drift.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to rebuild and publish, e.g. v0.3.8'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --cwd .github/release --frozen-lockfile --ignore-scripts
      - run: bun .github/release/check.mjs
      - name: Check the tag against the manifest version
        id: version
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
        run: |
          set -eu
          # A tag push names the tag directly; a manual run supplies it, so the
          # workflow can rebuild and republish an existing tag without anyone
          # having to bump a version and push a new one.
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            tag="$DISPATCH_TAG"
            if ! git rev-parse --verify --quiet "refs/tags/$tag" >/dev/null; then
              echo "::error::Tag $tag does not exist. Create it before dispatching."
              exit 1
            fi
          else
            tag="${GITHUB_REF_NAME}"
          fi
          version="${tag#v}"
          manifest="$(grep -m1 -E '^version = ' Cargo.toml | cut -d'"' -f2)"
          if [ "$version" != "$manifest" ]; then
            echo "::error::Tag $tag does not match the workspace version $manifest."
            echo "Bump Cargo.toml (python3 .github/release/version.py $version) or tag v$manifest."
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: release-manifests
          path: |
            Cargo.toml
            Cargo.lock
            fuzz/Cargo.lock
            packaging/macos/Info.plist
          if-no-files-found: error
          retention-days: 14

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
      PACKAGE_ROOT: dist
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # A manual dispatch runs on a branch, so the ref has to be the resolved
          # tag rather than whatever triggered the workflow.
          ref: ${{ needs.prepare.outputs.tag }}
          persist-credentials: false
      - uses: actions/download-artifact@v8.0.1
        with:
          name: release-manifests
          path: .
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt, clippy
      - name: Install NSIS
        run: choco install nsis --no-progress -y
      - name: Offline checks
        run: cargo xtask check
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun tests/login-handoff.cjs
      - name: Package app
        run: |
          cargo xtask package
          mkdir release-assets
          echo "ASSET=dsrp-$TAG-$RUNNER_OS-$RUNNER_ARCH" >> "$GITHUB_ENV"
      - name: Archive Windows package
        shell: pwsh
        run: |
          Compress-Archive -Path "$env:PACKAGE_ROOT/*" -DestinationPath "release-assets/$env:ASSET.zip"
          $installer = Get-ChildItem -Path "dist-installer/*-setup.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($installer) {
            Copy-Item -LiteralPath $installer.FullName -Destination "release-assets/$env:ASSET-Setup.exe"
          } else {
            Write-Error "NSIS produced no installer"
            exit 1
          }
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ env.ASSET }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14

  linux:
    needs: prepare
    uses: ./.github/workflows/linux-packages.yml
    with:
      release: true
      tag: ${{ needs.prepare.outputs.tag }}

  publish:
    needs: [prepare, build, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: dsrp-*
          path: release-assets
          merge-multiple: true
      - name: Checksums
        working-directory: release-assets
        run: sha256sum ./* > SHA256SUMS.txt
      - name: Publish the GitHub Release
        run: |
          set -eu
          test -n "$(ls -A release-assets)"
          # A rebuilt tag may already have a release, so create it when missing and
          # otherwise replace the assets. `--clobber` keeps a rerun from failing on
          # an asset that is already attached.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release-assets/* --clobber
          else
            gh release create "$TAG" \
              --title "dsrp $TAG" \
              --generate-notes \
              release-assets/*
          fi
